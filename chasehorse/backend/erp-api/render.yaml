# Render Blueprint — erp-api
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: chasehorse-erp-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter
    healthCheckPath: /actuator/health
    envVars:
      - key: PORT
        value: "8080"
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SUPABASE_JWT_ISSUER
        sync: false
      - key: FLYWAY_ENABLED
        value: "true"
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: MAIL_ENABLED
        sync: false
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_FROM_NAME
        sync: false
      - key: MAIL_ADMIN_CC
        sync: false
      - key: NOREPLY_MAIL_USERNAME
        sync: false
      - key: NOREPLY_MAIL_PASSWORD
        sync: false
      - key: ENQUIRY_ALERT_TO
        sync: false
      - key: ENQUIRY_OTP_SECRET
        sync: false
      - key: APP_PUBLIC_URL
        sync: false
